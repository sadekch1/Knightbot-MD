name: Bot
on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run bot
        run: timeout $((18000 + RANDOM % 2400)) node index.js || true
      - run: sleep $((RANDOM % 240))
      - name: Restart
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo ${{ github.repository }}
